openapi: 3.1.1
info:
  title: LostVault Claims API
  version: 1.0.0
  description: >-
    Contrato versionado de la frontera HTTP para reclamar un objeto perdido.
    La especificación es la fuente de verdad para el consumidor Flutter y el
    proveedor que la implemente.
servers:
  - url: https://api.lostvault.example
paths:
  /v1/objects/{objectId}/claims:
    post:
      operationId: createClaim
      summary: Solicita la reclamación de un objeto disponible.
      description: >-
        El proveedor identifica al usuario a partir del token y verifica su
        identidad antes de crear la reclamación. La operación es idempotente:
        el cliente debe enviar la misma Idempotency-Key en cada reintento, y si
        el objeto ya fue reclamado por el mismo usuario se devuelve la
        reclamación existente con 200 en lugar de 409.
      security:
        - bearerAuth: []
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Identificador único (p. ej. UUID v4) generado por el cliente para
            esta intención de reclamar. Se reenvía igual en cada reintento.
            Vigencia: 24 h, por usuario.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '201':
          description: Reclamación creada y verificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
              examples:
                verifiedClaim:
                  value:
                    objectId: '1'
                    userId: student-42
                    verified: true
          headers:
            Idempotent-Replayed:
              description: Vale "true" cuando la respuesta es la repetición de una petición anterior con la misma Idempotency-Key.
              schema:
                type: string
        '200':
          description: >-
            El objeto ya estaba reclamado por este mismo usuario (petición
            repetida sin Idempotency-Key). Se devuelve la reclamación existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/InvalidIdempotencyKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '409':
          $ref: '#/components/responses/ObjectAlreadyClaimed'
        '422':
          $ref: '#/components/responses/UnprocessableClaim'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Claim:
      type: object
      additionalProperties: false
      required:
        - objectId
        - userId
        - verified
      properties:
        objectId:
          type: string
        userId:
          type: string
        verified:
          type: boolean
          const: true
    Problem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - OBJECT_NOT_FOUND
            - OBJECT_ALREADY_CLAIMED
            - IDENTITY_NOT_VERIFIED
            - IDEMPOTENCY_KEY_REUSED
            - INVALID_IDEMPOTENCY_KEY
        message:
          type: string
  responses:
    Unauthenticated:
      description: No existe una sesión autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ObjectNotFound:
      description: El objeto solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ObjectAlreadyClaimed:
      description: El objeto ya fue reclamado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableClaim:
      description: >-
        La identidad del usuario no pudo verificarse (IDENTITY_NOT_VERIFIED), o
        la Idempotency-Key ya se usó para reclamar otro objeto
        (IDEMPOTENCY_KEY_REUSED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidIdempotencyKey:
      description: La cabecera Idempotency-Key viene vacía o supera 255 caracteres.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
